name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Debug secret presence
        env:
          VITE_FARO_URL: ${{ secrets.VITE_FARO_URL }}
        run: |
          if [ -n "$VITE_FARO_URL" ]; then
            echo "VITE_FARO_URL is SET (length: ${#VITE_FARO_URL} chars)"
          else
            echo "VITE_FARO_URL is EMPTY or UNSET"
          fi
      - name: Build
        env:
          VITE_API_BASE_URL: https://pizza-backend-frutas-felipe.vercel.app/api
          VITE_FARO_URL: ${{ secrets.VITE_FARO_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
